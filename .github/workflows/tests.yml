name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python train.py --check
      - run: node --check web/app.js
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ritmo_test
          POSTGRES_USER: ritmo_test
          POSTGRES_PASSWORD: ci-disposable-only
        options: >-
          --health-cmd "pg_isready -U ritmo_test -d ritmo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-postgres.txt
      - run: python -m unittest discover -s tests -p test_postgres.py -v
        env:
          RITMO_TEST_POSTGRES: '1'
          RITMO_DATABASE_URL: postgresql://ritmo_test:ci-disposable-only@127.0.0.1:5432/ritmo_test
